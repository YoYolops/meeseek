services:
  syncthing_server:
    image: syncthing/syncthing
    container_name: syncthing_server
    hostname: syncthing_server
    environment:
      - PUID=1000
      - PGID=1000
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - ./syncthing_server:/var/syncthing
    network_mode: host
    restart: unless-stopped

  syncthing_client:
    image: syncthing/syncthing
    container_name: syncthing_client
    hostname: syncthing_client
    environment:
      - PUID=1000
      - PGID=1000
      - STGUIADDRESS=0.0.0.0:8385
    volumes:
      - ./syncthing_client:/var/syncthing
      - ./syncthing_base_config.xml:/tmp/base_config.xml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/syncthing/config
        cp -n /tmp/base_config.xml /var/syncthing/config/config.xml
        chown -R ${PUID:-1000}:${PGID:-1000} /var/syncthing
        exec /bin/entrypoint.sh /bin/syncthing --home=/var/syncthing/config
    network_mode: host
    restart: unless-stopped